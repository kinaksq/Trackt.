<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trackt - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style type="text/tailwindcss">
    body {
      font-family: 'Manrope', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .bg-gradient-animate {
      background-size: 200% 200%;
      animation: gradient-shift 10s ease infinite;
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#11d462",
            "background-light": "#A3B899",
            "background-dark": "#3A5A40",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          animation: {
            'fade-in-scale': 'fadeInScale 2s ease-out forwards',
            'pulse-subtle': 'pulseSubtle 4s ease-in-out infinite'
          },
          keyframes: {
            fadeInScale: {
              '0%': {
                opacity: '0',
                transform: 'scale(0.95)'
              },
              '100%': {
                opacity: '1',
                transform: 'scale(1)'
              },
            },
            pulseSubtle: {
              '0%, 100%': {
                opacity: '1'
              },
              '50%': {
                opacity: '.9'
              },
            }
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<main class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center font-display group/design-root overflow-x-hidden bg-gradient-to-br from-[#A3B899] to-[#3A5A40] bg-gradient-animate">
<div class="flex flex-col items-center justify-center flex-grow">
<h1 class="text-[#F3F3F3] tracking-light text-5xl font-bold leading-tight text-center animate-fade-in-scale">Trackt.</h1>
</div>
<div class="w-full max-w-xs p-4 mb-16 opacity-0 animate-[fadeInScale_2s_ease-out_0.5s_forwards]">
<div class="flex flex-col gap-3">
<div class="rounded-full bg-white/20">
<div class="h-2 rounded-full bg-primary" style="width: 30%;"></div>
</div>
</div>
</div>
</main>

</body></html>
