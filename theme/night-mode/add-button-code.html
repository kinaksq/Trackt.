<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Transaction Modal - Dark Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "dark-bg": "#0D1F12",
            "card-surface": "#1A2E1F",
            "dark-text": "#E8F5E9",
            "text-muted": "rgba(232, 245, 233, 0.6)",
            "brand-sage": "#6EAD6E",
            "forest-green": "#2D5F3F",
            "accent-terracotta": "#E07856",
            "income-green": "#4CAF50",
            "expense-red": "#D84315",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
      scrollbar-width: none;-ms-overflow-style: none;}
    body::-webkit-scrollbar {
        width: 0px;
        background: transparent;}
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-900 font-display">
<div class="relative flex min-h-screen w-full flex-col justify-end bg-black/60 group/design-root">
<div class="flex w-full flex-col rounded-t-xl bg-dark-bg">
<div class="flex h-5 w-full items-center justify-center pt-3">
<div class="h-1.5 w-10 rounded-full bg-card-surface"></div>
</div>
<div class="relative flex items-center justify-center px-4 pt-2 pb-4">
<h4 class="text-dark-text text-base font-bold leading-normal tracking-wide text-center">Add Transaction</h4>
<button class="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-text-muted hover:text-dark-text">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex px-4 py-3">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-card-surface p-1">
<label class="flex h-full flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-lg has-[:checked]:bg-expense-red has-[:checked]:text-white has-[:checked]:font-semibold has-[:checked]:shadow-lg text-text-muted text-sm font-medium leading-normal">
<span class="truncate">Expense</span>
<input checked="" class="invisible w-0" name="transaction_type" type="radio" value="Expense"/>
</label>
<label class="flex h-full flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-lg has-[:checked]:bg-income-green has-[:checked]:text-white has-[:checked]:font-semibold has-[:checked]:shadow-lg text-text-muted text-sm font-medium leading-normal">
<span class="truncate">Income</span>
<input class="invisible w-0" name="transaction_type" type="radio" value="Income"/>
</label>
</div>
</div>
<div class="relative flex items-center justify-center px-4 pt-6 pb-4">
<span class="text-3xl font-medium text-text-muted pr-2">$</span>
<input class="w-full border-none bg-transparent p-0 text-center text-6xl font-bold text-expense-red focus:ring-0" type="text" value="0.00"/>
</div>
<div class="flex gap-2 overflow-x-auto p-4 scrollbar-hide">
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-card-surface pl-3 pr-4">
<p class="text-lg">🍔</p>
<p class="text-dark-text text-sm font-medium leading-normal">Food</p>
</div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-card-surface pl-3 pr-4">
<p class="text-lg">🚌</p>
<p class="text-dark-text text-sm font-medium leading-normal">Transport</p>
</div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-brand-sage pl-3 pr-4 ring-2 ring-brand-sage ring-offset-2 ring-offset-dark-bg">
<p class="text-lg">🛍️</p>
<p class="text-white text-sm font-semibold leading-normal">Shopping</p>
</div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-card-surface pl-3 pr-4">
<p class="text-lg">📄</p>
<p class="text-dark-text text-sm font-medium leading-normal">Bills</p>
</div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-card-surface pl-3 pr-4">
<p class="text-lg">🎬</p>
<p class="text-dark-text text-sm font-medium leading-normal">Entertainment</p>
</div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-card-surface pl-3 pr-4">
<p class="text-lg">💊</p>
<p class="text-dark-text text-sm font-medium leading-normal">Health</p>
</div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-full bg-card-surface pl-3 pr-4">
<p class="text-lg">💼</p>
<p class="text-dark-text text-sm font-medium leading-normal">Salary</p>
</div>
</div>
<div class="flex flex-col gap-4 p-4">
<div class="relative">
<input class="peer h-12 w-full rounded-lg border-2 border-card-surface bg-card-surface px-4 text-dark-text placeholder-transparent focus:border-brand-sage focus:outline-none focus:ring-0" id="description" placeholder="Description (optional)" type="text"/>
<label class="absolute -top-2 left-3 bg-dark-bg px-1 text-xs text-text-muted transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-focus:-top-2 peer-focus:text-xs peer-focus:text-brand-sage" for="description">Description (optional)</label>
</div>
<div class="relative">
<input class="peer h-12 w-full rounded-lg border-2 border-card-surface bg-card-surface px-4 text-dark-text focus:border-brand-sage focus:outline-none focus:ring-0" id="date" type="text" value="Today"/>
<label class="absolute -top-2 left-3 bg-dark-bg px-1 text-xs text-text-muted" for="date">Date</label>
</div>
</div>
<div class="grid grid-cols-2 gap-4 border-t border-card-surface px-4 pt-4 pb-6">
<button class="flex h-12 w-full items-center justify-center rounded-xl border-2 border-card-surface text-base font-bold text-dark-text transition-colors hover:bg-card-surface/50">Cancel</button>
<button class="flex h-12 w-full items-center justify-center rounded-xl bg-brand-sage text-base font-bold text-dark-bg transition-opacity hover:opacity-90">Add Transaction</button>
</div>
</div>
</div>

</body></html>
